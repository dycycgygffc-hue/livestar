name: Android Release
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform files if needed
        run: |
          if [ ! -d android/app ]; then flutter create . --platforms=android --project-name=livestar --org=com.livestar.app; fi
      - run: flutter pub get
      - run: flutter analyze || true
      - name: Configure signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_B64"
          echo "$KEYSTORE_B64" | base64 --decode > android/livestar-upload-keystore.jks
          cat > android/key.properties <<EOF2
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$GITHUB_WORKSPACE/android/livestar-upload-keystore.jks
          EOF2
      - name: Build AAB
        env:
          API_URL: ${{ secrets.LIVESTAR_API_URL }}
        run: flutter build appbundle --release --dart-define=API_URL="$API_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: livestar-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
