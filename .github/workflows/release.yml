name: LiveStar Release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - name: Check API URL
        run: test -n "${{ secrets.API_URL }}" && [[ "${{ secrets.API_URL }}" == https://* ]]
      - name: Build signed AAB
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          test -n "$KEYSTORE_B64"; test -n "$KEY_PROPERTIES"
          echo "$KEYSTORE_B64" | base64 --decode > android/upload-keystore.jks
          printf '%s\n' "$KEY_PROPERTIES" > android/key.properties
          flutter build appbundle --release --dart-define=API_URL="${{ secrets.API_URL }}"
      - uses: actions/upload-artifact@v4
        with:
          name: livestar-aab
          path: build/app/outputs/bundle/release/*.aab
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node --check src/server.js
